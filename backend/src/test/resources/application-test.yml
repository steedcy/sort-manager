spring:
  datasource:
    url: jdbc:h2:mem:sort_manager_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  auth:
    jwt-secret: test-only-jwt-secret-that-is-at-least-32-bytes-long
    access-ttl-seconds: 900
    refresh-ttl-days: 30
  bootstrap:
    username: test-owner
    password: Test-password-2026!
    display-name: Test Owner
    household-name: Test Household
  upload:
    path: build/test-uploads/

logging:
  level:
    com.sort.manager: WARN
