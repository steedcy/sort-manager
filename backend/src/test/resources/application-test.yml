spring:
  datasource:
    url: jdbc:h2:mem:sort_manager_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  upload:
    path: build/test-uploads/
    url-prefix: /uploads/

logging:
  level:
    com.sort.manager: WARN
