name: CI

on:
  push:
    branches: [main, "codex/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Run backend tests
        run: mvn clean test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  operations:
    name: Backup and recovery checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: ./ops/tests/syntax-check.ps1

      - name: Test encrypted backup round-trip
        shell: pwsh
        run: ./ops/tests/backup-roundtrip.tests.ps1

  e2e:
    name: Full-stack E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend, operations]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: sort_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Start backend and wait for readiness
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/sort_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: root
          DB_PASSWORD: e2e_root
          JPA_DDL_AUTO: validate
          FLYWAY_BASELINE_ON_MIGRATE: "false"
          APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
          APP_JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long-2026
          APP_JWT_ACCESS_TTL_SECONDS: "900"
          APP_REFRESH_TTL_DAYS: "30"
          APP_LOGIN_MAX_ATTEMPTS: "5"
          APP_LOGIN_BLOCK_SECONDS: "600"
          APP_BOOTSTRAP_USERNAME: e2e_owner
          APP_BOOTSTRAP_PASSWORD: E2E-only-Strong-Password-2026!
          APP_BOOTSTRAP_DISPLAY_NAME: E2E Owner
          APP_BOOTSTRAP_HOUSEHOLD_NAME: E2E Household
        run: |
          nohup java -jar target/manager.jar > backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080/api/v1
          E2E_USERNAME: e2e_owner
          E2E_PASSWORD: E2E-only-Strong-Password-2026!
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/backend.log
